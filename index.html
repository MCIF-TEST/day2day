<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Discipline Checklist</title>
  <style>
    :root{
      --bg: #0b0f14;
      --panel: #0f1720;
      --text: #e8edf4;
      --muted: #9aa7b5;
      --line: rgba(255,255,255,0.10);
      --accent: #d34b4b;
      --good: #2bd576;
      --warn: #f0c35a;
      --shadow: 0 10px 30px rgba(0,0,0,0.55);
      --radius: 16px;
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji","Segoe UI Emoji";
    }
    *{ box-sizing:border-box; }
    body{
      margin:0;
      font-family: var(--sans);
      background:
        radial-gradient(1100px 780px at 20% -10%, rgba(211,75,75,0.20), transparent 50%),
        radial-gradient(900px 650px at 120% 0%, rgba(43,213,118,0.10), transparent 50%),
        var(--bg);
      color: var(--text);
    }
    .wrap{ max-width: 980px; margin:0 auto; padding: 22px 16px 40px; }
    header{ display:flex; flex-wrap:wrap; gap:12px; align-items:flex-end; justify-content:space-between; margin-bottom: 14px; }
    h1{ font-size: 22px; margin:0; letter-spacing:0.4px; }
    .sub{
      color: var(--muted);
      font-size: 13px;
      display:flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
      font-family: var(--mono);
      margin-top: 8px;
    }
    .pill{
      border: 1px solid var(--line);
      border-radius: 999px;
      padding: 6px 10px;
      background: rgba(255,255,255,0.03);
      white-space: nowrap;
    }
    .pill strong{ color: var(--text); }
    .fasting{
      border-color: rgba(240,195,90,0.35);
      background: rgba(240,195,90,0.08);
      color: #ffe1a4;
    }

    .panel{
      background: linear-gradient(180deg, rgba(255,255,255,0.03), rgba(255,255,255,0.02));
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      overflow:hidden;
    }
    .panelHead{
      padding: 14px 16px;
      border-bottom: 1px solid var(--line);
      display:flex;
      align-items:center;
      justify-content: space-between;
      gap: 12px;
      background: rgba(0,0,0,0.15);
      flex-wrap: wrap;
    }

    .progressWrap{ display:flex; flex-direction:column; gap: 6px; min-width: 280px; flex: 1; }
    .progressLabel{
      display:flex;
      justify-content: space-between;
      gap: 12px;
      font-size: 12px;
      color: var(--muted);
      font-family: var(--mono);
      flex-wrap: wrap;
    }
    .bar{
      height: 10px;
      background: rgba(255,255,255,0.06);
      border: 1px solid var(--line);
      border-radius: 999px;
      overflow:hidden;
    }
    .bar > div{
      height:100%;
      width:0%;
      background: linear-gradient(90deg, var(--accent), rgba(43,213,118,0.95));
      transition: width 220ms ease;
    }

    .actions{ display:flex; flex-wrap:wrap; gap:10px; justify-content:flex-end; }
    button{
      appearance:none;
      border: 1px solid var(--line);
      background: rgba(255,255,255,0.03);
      color: var(--text);
      padding: 10px 12px;
      border-radius: 12px;
      cursor:pointer;
      font-weight: 800;
      letter-spacing: 0.2px;
      font-family: var(--sans);
    }
    button:hover{ background: rgba(255,255,255,0.06); }
    button:active{ transform: translateY(1px); }
    button.danger{
      border-color: rgba(211,75,75,0.35);
      background: rgba(211,75,75,0.10);
    }

    .list{ padding: 6px 0; }
    .item{
      display:flex;
      align-items:center;
      gap: 12px;
      padding: 12px 16px;
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    .item:first-child{ border-top:0; }
    .item:hover{ background: rgba(255,255,255,0.03); }

    .left{ display:flex; align-items:center; gap:12px; flex:1; min-width:0; }
    .meta{ display:flex; flex-direction:column; gap:4px; min-width:0; }
    .labelRow{ display:flex; flex-wrap:wrap; align-items:baseline; gap:8px; min-width:0; }
    .label{
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 100%;
    }
    .tag{
      font-size: 11px;
      padding: 3px 8px;
      border-radius: 999px;
      border: 1px solid var(--line);
      color: var(--muted);
      font-family: var(--mono);
      background: rgba(255,255,255,0.02);
    }
    .tag.optional{
      border-color: rgba(154,167,181,0.25);
      background: rgba(154,167,181,0.06);
    }
    .tag.required{
      border-color: rgba(211,75,75,0.35);
      background: rgba(211,75,75,0.08);
      color: #ffb3b3;
    }
    .tag.fasting{
      border-color: rgba(240,195,90,0.35);
      background: rgba(240,195,90,0.10);
      color: #ffe1a4;
    }
    .desc{ font-size: 12px; color: var(--muted); font-family: var(--mono); }

    input[type="checkbox"]{
      width: 20px;
      height: 20px;
      accent-color: var(--good);
      cursor:pointer;
      flex: 0 0 auto;
    }

    footer{
      margin-top: 14px;
      color: var(--muted);
      font-size: 12px;
      font-family: var(--mono);
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content: space-between;
      align-items:center;
    }
  </style>
</head>

<body>
  <div class="wrap">
    <header>
      <div>
        <h1>Discipline Checklist</h1>
        <div class="sub">
          <span class="pill">Phoenix time: <strong id="phxNow">—</strong></span>
          <span class="pill">Discipline day: <strong id="dayKey">—</strong></span>
          <span class="pill">Resets at: <strong>2:00am</strong> <strong>(America/Phoenix)</strong></span>
          <span class="pill">Next reset in: <strong id="countdown">—</strong></span>
          <span class="pill fasting" id="fastingPill" style="display:none;">FASTING DAY (Required)</span>
        </div>
      </div>
    </header>

    <section class="panel">
      <div class="panelHead">
        <div class="progressWrap">
          <div class="progressLabel">
            <span>Completion</span>
            <span><strong id="pct">0%</strong> • <span id="doneCount">0</span>/<span id="needCount">0</span></span>
          </div>
          <div class="bar" aria-hidden="true"><div id="barFill"></div></div>
        </div>

        <div class="actions">
          <button id="btnMarkAll">Mark all</button>
          <button class="danger" id="btnResetDay">Reset today</button>
        </div>
      </div>

      <div class="list" id="list" role="list"></div>
    </section>

    <footer>
      <div id="status">—</div>
      <div>Persisted via IndexedDB (fallback: localStorage)</div>
    </footer>
  </div>

  <script src="./app.js"></script>
</body>
</html>
